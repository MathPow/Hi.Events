events {}

http {
   server {
       listen 80;
       listen [::]:80;
       server_name _;

       root /app/backend/public;

       add_header X-XSS-Protection "1; mode=block";

       index index.html index.htm index.php;
       charset utf-8;

       access_log /dev/stdout;
       error_log /dev/stderr;

        location /storage {
            alias /app/backend/storage/app/public;
            access_log off;
            expires max;
            add_header Cache-Control "public";
        }

        location ^~ /api/ {
            rewrite ^/api(/.*)$ /index.php$1 break;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $1;
            fastcgi_pass localhost:9000;
            client_max_body_size 20M;
        }

       location ~ \.php$ {
           include fastcgi_params;
           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
           fastcgi_split_path_info ^(.+\.php)(/.+)$;
           fastcgi_pass localhost:9000;
           fastcgi_index index.php;
           fastcgi_param PHP_VALUE "error_log=/dev/stderr";
       }

        # Les fichiers de /assets portent un hachage de CONTENU dans leur nom:
        # ils ne changent jamais sous le meme nom. On peut donc les garder un an
        # sans risque — et surtout, ca reprend la main sur Cloudflare, qui faute
        # d'en-tete d'origine leur collait un max-age=14400 devine.
        location ^~ /assets/ {
            proxy_pass http://localhost:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-XSS-Protection "1; mode=block";
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

       location / {
           proxy_pass http://localhost:5678;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;

           # Le HTML, lui, ne doit JAMAIS etre garde: il reference les morceaux
           # ci-dessus par leur nom hache, qui change a chaque build. Un HTML
           # perime demande des fichiers qui n'existent plus -> le routeur
           # echoue et l'utilisateur voit « Something went wrong » apres CHAQUE
           # deploiement. Sans en-tete, les navigateurs appliquent leur cache
           # heuristique et c'est exactement ce qui se produisait.
           #
           # `add_header` n'herite pas du bloc parent des qu'un bloc en declare
           # un: on repose donc X-XSS-Protection ici.
           add_header X-XSS-Protection "1; mode=block";
           add_header Cache-Control "no-store, must-revalidate";
       }

       location = /favicon.ico { access_log off; log_not_found off; }
       location = /robots.txt  { access_log off; log_not_found off; }

       error_page 404 /index.php;

       location ~ /\.(?!well-known).* {
           deny all;
       }
   }
}
