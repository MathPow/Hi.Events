events {}

http {
   # Sans cette table, nginx servait les images televersees en text/plain. Avec
   # nosniff, un navigateur refuserait alors de les afficher sur un autre site
   # (widget integre, par exemple).
   include /etc/nginx/mime.types;
   default_type application/octet-stream;

   # Le traceur de parcours route ses lignes sur BRouter, heberge a cote dans le
   # conteneur dehors-brouter (reseau coolify). Par visiteur (Cloudflare donne son
   # adresse), quelques requetes par seconde et 6 a la fois: une recherche de boucles
   # en demande une quarantaine, deux de suite passent, pas un usage de service gratuit.
   map $http_cf_connecting_ip $routing_client {
       ""      $remote_addr;
       default $http_cf_connecting_ip;
   }
   limit_req_zone $routing_client zone=routing:5m rate=8r/s;
   limit_conn_zone $routing_client zone=routing_conn:5m;

   server {
       listen 80;
       listen [::]:80;
       server_name _;

       # Un visiteur arrive en http:// (lien colle sans https dans Facebook, dont
       # le navigateur integre ne passe pas tout seul en https comme Safari):
       # l'API, appelee en https, refusait alors la page (CORS) et « Continue »
       # ne faisait rien. Cloudflare dit dans CF-Visitor ce que le visiteur a
       # demande; on le renvoie en https.
       if ($http_cf_visitor ~ '"scheme":"http"') {
           return 301 https://$host$request_uri;
       }

       root /app/backend/public;

       add_header X-XSS-Protection "1; mode=block";
       add_header X-Content-Type-Options "nosniff" always;

       index index.html index.htm index.php;
       charset utf-8;

       access_log /dev/stdout;
       error_log /dev/stderr;

        # Fichiers televerses par les organisateurs: jamais executes. nosniff
        # empeche le navigateur de deviner un type autre que celui annonce, et
        # le bac a sable CSP prive de scripts et d'origine tout document qui
        # serait servi d'ici, meme si un fichier mal nomme s'y trouvait.
        location /storage {
            alias /app/backend/storage/app/public;
            access_log off;
            expires max;
            add_header Cache-Control "public";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
        }

        # Resolu a chaque requete: sans le conteneur dehors-brouter, nginx demarre quand
        # meme, repond 502, et la carte passe sur brouter.de.
        location = /brouter {
            limit_req zone=routing burst=80 nodelay;
            limit_req_status 429;
            limit_conn routing_conn 6;
            limit_conn_status 429;
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $brouter_upstream http://dehors-brouter:17777;
            proxy_pass $brouter_upstream/brouter$is_args$args;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
            proxy_set_header X-Forwarded-For $routing_client;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ^~ /api/ {
            rewrite ^/api(/.*)$ /index.php$1 break;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $1;
            fastcgi_pass localhost:9000;
            client_max_body_size 35M;
        }

       location ~ \.php$ {
           include fastcgi_params;
           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
           fastcgi_split_path_info ^(.+\.php)(/.+)$;
           fastcgi_pass localhost:9000;
           fastcgi_index index.php;
           fastcgi_param PHP_VALUE "error_log=/dev/stderr";
       }

        # Les fichiers de /assets portent un hachage de CONTENU dans leur nom:
        # ils ne changent jamais sous le meme nom. On peut donc les garder un an
        # sans risque — et surtout, ca reprend la main sur Cloudflare, qui faute
        # d'en-tete d'origine leur collait un max-age=14400 devine.
        # Sans `always`, add_header ne touche que les reponses reussies: un
        # fichier absent garde le 404 no-store de server.js.
        location ^~ /assets/ {
            proxy_pass http://localhost:5678;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-XSS-Protection "1; mode=block";
            add_header X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

       location / {
           proxy_pass http://localhost:5678;
           proxy_http_version 1.1;
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;

           # Le HTML, lui, ne doit JAMAIS etre garde: il reference les morceaux
           # ci-dessus par leur nom hache, qui change a chaque build. Un HTML
           # perime demande des fichiers qui n'existent plus -> le routeur
           # echoue et l'utilisateur voit « Something went wrong » apres CHAQUE
           # deploiement. Sans en-tete, les navigateurs appliquent leur cache
           # heuristique et c'est exactement ce qui se produisait.
           #
           # `add_header` n'herite pas du bloc parent des qu'un bloc en declare
           # un: on repose donc X-XSS-Protection ici.
           add_header X-XSS-Protection "1; mode=block";
           add_header X-Content-Type-Options "nosniff" always;
           add_header Cache-Control "no-store, must-revalidate";
       }

       location = /favicon.ico { access_log off; log_not_found off; }
       location = /robots.txt  { access_log off; log_not_found off; }

       error_page 404 /index.php;

       location ~ /\.(?!well-known).* {
           deny all;
       }
   }
}
